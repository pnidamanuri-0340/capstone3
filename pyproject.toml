[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlit"
version = "0.1.0"
description = "Multi-agent financial literacy assistant (LangGraph + RAG + Alpha Vantage + MCP + Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "streamlit>=1.50",
    "mcp>=1.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "pandas>=2.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finlit = "finlit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finlit = ["knowledge/**/*.md", "evals/data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real API keys and network (skipped by default)",
]
addopts = "-q -m 'not live'"
